[project]
name = "industrial-maintenance"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "catboost==1.2.10",
    "matplotlib>=3.8",
    "mlflow>=3.17.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "seaborn>=0.13",
]

[project.optional-dependencies]
transformer = [
    "accelerate==1.12.0",
    "torch==2.9.1",
    "transformers==4.57.6",
]
transformer-cuda = [
    "accelerate==1.12.0",
    "torch==2.9.1",
    "transformers==4.57.6",
]

[dependency-groups]
dev = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.uv]
conflicts = [[{ extra = "transformer" }, { extra = "transformer-cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "transformer" },
    { index = "pytorch-cu126", extra = "transformer-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

