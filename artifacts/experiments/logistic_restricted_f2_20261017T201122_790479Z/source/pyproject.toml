[project]
name = "industrial-maintenance"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "mlflow>=3.17.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

